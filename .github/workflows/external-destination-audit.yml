name: External destination audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-destination-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Probe external destinations from reviewed build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned browser-test dependencies
        run: npm install --no-save --no-package-lock @playwright/test@1.65.1 @axe-core/playwright@4.14.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build reviewed commit
        run: npm run build

      - name: Probe rendered external destinations
        env:
          P8_EXTERNAL_DESTINATION_AUDIT: "1"
        run: >
          npx playwright test tests/e2e/release-readiness.spec.ts
          --project=chromium
          --grep "external destinations are audited on the reviewed production build"

      - name: Upload reachability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-destination-audit-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
