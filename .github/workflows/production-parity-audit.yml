name: Production parity audit

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Full 40-character commit SHA being evaluated for production"
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: production-parity-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only production and deployment evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate audit script
        run: node --check scripts/audit-production-parity.mjs

      - name: Verify expected commit exists in this checkout
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          echo "$EXPECTED_COMMIT" | grep -Eq '^[0-9a-fA-F]{40}$'
          git cat-file -e "$EXPECTED_COMMIT^{commit}"
          test "$(git rev-parse HEAD)" = "$(printf '%s' "$EXPECTED_COMMIT" | tr '[:upper:]' '[:lower:]')"

      - name: Inspect production domain and deployment records
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-production-parity.mjs

      - name: Upload production parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-parity-audit-${{ inputs.expected_commit }}-${{ github.run_attempt }}
          path: artifacts/production-parity-audit.json
          if-no-files-found: warn
          retention-days: 90
