<g font-family="Manrope,Arial,sans-serif" font-size="31" font-weight="700" letter-spacing="-1.3" fill="#F1F0E8"><text x="16" y="185">I build digital</text><text x="16" y="221">products from</text><text x="16" y="257">product logic</text><text x="16" y="293">to production.</text></g>
<g font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12.8" fill="#B4BFB8"><text x="16" y="344">I work across product thinking, interface design,</text><text x="16" y="362">and software engineering—bringing complex</text><text x="16" y="380">workflows into software that is clear to use and</text><text x="16" y="398">practical to operate.</text></g>
