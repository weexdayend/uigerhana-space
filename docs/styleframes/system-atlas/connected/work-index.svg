<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2580" viewBox="0 0 1440 2580" role="img" aria-labelledby="t d"><title id="t">The System Atlas — work index desktop styleframe</title><desc id="d">Editorial work index with one approved in-progress personal case study and four generalized work domains; no draft-only client work is presented as public case studies.</desc><rect x="0" y="0" width="1440" height="2580" rx="0" fill="#F1F0E8" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#10191B" stroke="none" stroke-width="1"/><rect x="120" y="31" width="18" height="18" rx="2" fill="#D99B68" stroke="none" stroke-width="1"/><text x="154" y="46" font-family="Plus Jakarta Sans" font-size="13" font-weight="700" fill="#F1F0E8" text-anchor="start" letter-spacing="2.5">GERHANA</text><text x="1200" y="47" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">HOME ↗</text><text x="1320" y="47" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#D99B68" text-anchor="end">RÉSUMÉ ↗</text><text x="120" y="180" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">PORTFOLIO / SELECTED WORK</text><text x="120" y="280" font-family="Manrope" font-size="62" font-weight="600" fill="#10191B" letter-spacing="-2.6"><tspan x="120" dy="0">Work shaped by</tspan><tspan x="120" dy="63.24">real problems.</tspan></text><text x="840" y="250" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#53645E"><tspan x="840" dy="0">A selection of product and engineering work, presented with</tspan><tspan x="840" dy="25.5">context around the problem, approach, implementation, and</tspan><tspan x="840" dy="25.5">current state. Project-specific details are published only</tspan><tspan x="840" dy="25.5">when they are ready to be shared.</tspan></text><text x="120" y="465" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">01 / PUBLIC CASE STUDY</text><rect x="120" y="510" width="1200" height="400" rx="2" fill="#E8E6DC" stroke="#C6C8BE" stroke-width="1"/><rect x="120" y="510" width="8" height="400" rx="0" fill="#D99B68" stroke="none" stroke-width="1"/><text x="160" y="565" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">INDEPENDENT PRODUCT / IN PROGRESS</text><text x="160" y="650" font-family="Manrope" font-size="38" font-weight="600" fill="#10191B"><tspan x="160" dy="0">Building a personal</tspan><tspan x="160" dy="41.040000000000006">professional platform</tspan></text><text x="760" y="630" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#53645E"><tspan x="760" dy="0">Reframing a personal website into a coherent professional</tspan><tspan x="760" dy="25.5">identity, portfolio, and résumé experience.</tspan></text><line x1="760" y1="730" x2="1280" y2="730" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="760" y="780" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">CONTEXT</text><text x="900" y="780" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B" text-anchor="start">Independent personal project</text><text x="760" y="825" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">ROLE</text><text x="900" y="825" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#10191B" text-anchor="start">Product direction · IA · Visual direction · Implementation oversight</text><text x="160" y="860" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#10191B" text-anchor="start" letter-spacing="0.8">READ CASE STUDY ↗</text><rect x="0" y="990" width="1440" height="1340" rx="0" fill="#E8E6DC" stroke="none" stroke-width="1"/><text x="120" y="1080" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">02 / WORK DOMAINS</text><text x="120" y="1160" font-family="Manrope" font-size="46" font-weight="600" fill="#10191B"><tspan x="120" dy="0">Areas I have</tspan><tspan x="120" dy="48.300000000000004">worked across.</tspan></text><text x="825" y="1125" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#53645E" text-anchor="start">Generalized summaries derived from professional experience.</text><rect x="120" y="1280" width="570" height="370" rx="2" fill="#F1F0E8" stroke="#C6C8BE" stroke-width="1"/><text x="148" y="1332" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">01</text><text x="148" y="1395" font-family="Manrope" font-size="24" font-weight="600" fill="#10191B" text-anchor="start">Enterprise AI &amp; intelligent workflows</text><text x="148" y="1455" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#53645E"><tspan x="148" dy="0">AI-assisted reporting, intelligent assistants, and</tspan><tspan x="148" dy="18">extraction workflows turn unstructured operational</tspan><tspan x="148" dy="18">and financial information into usable data.</tspan></text><line x1="148" y1="1580" x2="662" y2="1580" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="148" y="1615" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">AI ENGINEERING · AUTOMATION · DATA EXTRACTION</text><rect x="730" y="1280" width="570" height="370" rx="2" fill="#F1F0E8" stroke="#C6C8BE" stroke-width="1"/><text x="758" y="1332" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">02</text><text x="758" y="1395" font-family="Manrope" font-size="24" font-weight="600" fill="#10191B" text-anchor="start">Transaction &amp; operational intelligence</text><text x="758" y="1455" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#53645E"><tspan x="758" dy="0">Structured data pipelines, canonical modeling,</tspan><tspan x="758" dy="18">monitoring, and reporting systems for business</tspan><tspan x="758" dy="18">and operational workflows.</tspan></text><line x1="758" y1="1580" x2="1272" y2="1580" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="758" y="1615" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">DATA ARCHITECTURE · INTEGRATION · OPERATIONS</text><rect x="120" y="1705" width="570" height="370" rx="2" fill="#F1F0E8" stroke="#C6C8BE" stroke-width="1"/><text x="148" y="1757" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">03</text><text x="148" y="1820" font-family="Manrope" font-size="24" font-weight="600" fill="#10191B" text-anchor="start">Digital platforms &amp; business systems</text><text x="148" y="1880" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#53645E"><tspan x="148" dy="0">Software for public services, distribution,</tspan><tspan x="148" dy="18">logistics, point-of-sale operations, ERP, and</tspan><tspan x="148" dy="18">internal business processes.</tspan></text><line x1="148" y1="2005" x2="662" y2="2005" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="148" y="2040" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">ENTERPRISE PLATFORMS · ERP · POS</text><rect x="730" y="1705" width="570" height="370" rx="2" fill="#F1F0E8" stroke="#C6C8BE" stroke-width="1"/><text x="758" y="1757" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">04</text><text x="758" y="1820" font-family="Manrope" font-size="24" font-weight="600" fill="#10191B" text-anchor="start">Network systems &amp; information security</text><text x="758" y="1880" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#53645E"><tspan x="758" dy="0">Infrastructure reporting, SNMP-based network</tspan><tspan x="758" dy="18">monitoring, operational alerts, and policy-driven</tspan><tspan x="758" dy="18">information-protection systems.</tspan></text><line x1="758" y1="2005" x2="1272" y2="2005" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="758" y="2040" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">INFRASTRUCTURE · MONITORING · CYBERSECURITY</text><rect x="0" y="2330" width="1440" height="250" rx="0" fill="#172426" stroke="none" stroke-width="1"/><text x="120" y="2425" font-family="Manrope" font-size="18" font-weight="600" fill="#F1F0E8" text-anchor="start">More evidence will appear here when its role, status, and disclosure are approved.</text><text x="120" y="2485" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">No draft-only project detail is represented as public work.</text></svg>