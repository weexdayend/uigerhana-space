<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500" role="img" aria-labelledby="t d"><title id="t">The System Atlas — GSAP motion storyboard</title><desc id="d">Static motion storyboard: copy settle, route draw, waypoints, section transition, reduced-motion state. No pinned panels or perpetual motion.</desc><rect x="0" y="0" width="1440" height="1500" rx="0" fill="#10191B" stroke="none" stroke-width="1"/><text x="100" y="100" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">SYSTEM ATLAS / MOTION CHOREOGRAPHY</text><text x="100" y="180" font-family="Manrope" font-size="42" font-weight="600" fill="#F1F0E8" text-anchor="start">One route. Four meaningful stages.</text><text x="100" y="230" font-family="Plus Jakarta Sans" font-size="14" font-weight="400" fill="#B4BFB8"><tspan x="100" dy="0">Motion is a reading aid, not a gate. The static composition must already communicate identity,</tspan><tspan x="100" dy="23.8">content, and next steps before JavaScript or GSAP runs.</tspan></text><rect x="100" y="330" width="280" height="220" rx="2" fill="#172426" stroke="#3C4A49" stroke-width="1"/><text x="124" y="370" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">01</text><text x="124" y="415" font-family="Manrope" font-size="15" font-weight="600" fill="#F1F0E8" text-anchor="start">COPY SETTLE</text><text x="124" y="455" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">0.55–0.75s</text><text x="124" y="495" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8"><tspan x="124" dy="0">ertical settle in reading order.</tspan></text><rect x="410" y="330" width="280" height="220" rx="2" fill="#172426" stroke="#3C4A49" stroke-width="1"/><text x="434" y="370" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">02</text><text x="434" y="415" font-family="Manrope" font-size="15" font-weight="600" fill="#F1F0E8" text-anchor="start">ROUTE DRAW</text><text x="434" y="455" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">0.90–1.15s</text><text x="434" y="495" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8"><tspan x="434" dy="0">raws from origin to destination.</tspan></text><rect x="720" y="330" width="280" height="220" rx="2" fill="#172426" stroke="#3C4A49" stroke-width="1"/><text x="744" y="370" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">03</text><text x="744" y="415" font-family="Manrope" font-size="15" font-weight="600" fill="#F1F0E8" text-anchor="start">WAYPOINTS</text><text x="744" y="455" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">0.18–0.24s each</text><text x="744" y="495" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8"><tspan x="744" dy="0">aypoint as the route reaches it.</tspan></text><rect x="1030" y="330" width="280" height="220" rx="2" fill="#172426" stroke="#3C4A49" stroke-width="1"/><text x="1054" y="370" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">04</text><text x="1054" y="415" font-family="Manrope" font-size="15" font-weight="600" fill="#F1F0E8" text-anchor="start">SECTION REVEAL</text><text x="1054" y="455" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">0.45–0.65s</text><text x="1054" y="495" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8"><tspan x="1054" dy="0">r reveal as content enters view.</tspan></text><text x="100" y="650" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">TIMELINE / INITIAL CHOREOGRAPHY</text><line x1="150" y1="760" x2="1290" y2="760" stroke="#3C4A49" stroke-width="2" opacity="1"/><circle cx="150" cy="760" r="6" fill="#86A89B" stroke="none" stroke-width="1"/><text x="150" y="720" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">COPY</text><text x="150" y="800" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">0.0s</text><circle cx="470" cy="760" r="6" fill="#86A89B" stroke="none" stroke-width="1"/><text x="470" y="720" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">ROUTE</text><text x="470" y="800" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">0.7s</text><circle cx="650" cy="760" r="6" fill="#86A89B" stroke="none" stroke-width="1"/><text x="650" y="720" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">UNDERSTAND</text><text x="650" y="800" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">1.0s</text><circle cx="850" cy="760" r="6" fill="#86A89B" stroke="none" stroke-width="1"/><text x="850" y="720" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">SHAPE</text><text x="850" y="800" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">1.35s</text><circle cx="1050" cy="760" r="6" fill="#86A89B" stroke="none" stroke-width="1"/><text x="1050" y="720" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">ENGINEER</text><text x="1050" y="800" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">1.7s</text><circle cx="1270" cy="760" r="6" fill="#D99B68" stroke="none" stroke-width="1"/><text x="1270" y="720" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#D99B68" text-anchor="middle">OPERATE</text><text x="1270" y="800" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="middle">2.1s</text><text x="100" y="900" font-family="Manrope" font-size="19" font-weight="600" fill="#F1F0E8" text-anchor="start">Section transitions</text><text x="100" y="945" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#B4BFB8"><tspan x="100" dy="0">Use one restrained reveal when the next section enters view. No pinned panels,</tspan><tspan x="100" dy="20.8">scroll hijacking, perpetual movement, loading curtain, or mandatory parallax.</tspan></text><rect x="100" y="1050" width="1240" height="310" rx="2" fill="#172426" stroke="#86A89B" stroke-width="1.5"/><text x="140" y="1110" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">PREFERS-REDUCED-MOTION / STATIC STATE</text><path d="M 170 1220 C 350 1120 490 1290 650 1215 S 900 1160 1060 1240 S 1190 1260 1280 1180" fill="none" stroke="#86A89B" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="1220" r="7" fill="#86A89B" stroke="none" stroke-width="1"/><circle cx="650" cy="1215" r="7" fill="#86A89B" stroke="none" stroke-width="1"/><circle cx="1060" cy="1240" r="7" fill="#86A89B" stroke="none" stroke-width="1"/><circle cx="1280" cy="1180" r="7" fill="#D99B68" stroke="none" stroke-width="1"/><text x="170" y="1300" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">UNDERSTAND</text><text x="560" y="1300" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">SHAPE</text><text x="980" y="1300" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">ENGINEER</text><text x="1280" y="1300" font-family="ui-monospace, monospace" font-size="10" font-weight="400" fill="#D99B68" text-anchor="end">OPERATE</text><text x="140" y="1340" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#F1F0E8" text-anchor="start">Complete route and every waypoint are visible immediately; no motion is required to understand or use the page.</text></svg>