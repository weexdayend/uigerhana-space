rchitecture, data pipelines, and AI integration.</tspan><tspan x="310" dy="19.200000000000003">Focused on enterprise AI engineering, intelligent automation, and agentic systems that fit real</tspan><tspan x="310" dy="19.200000000000003">business contexts, with an emphasis on explainable, maintainable, production-ready software.</tspan></text><line x1="310" y1="490" x2="1130" y2="490" stroke="#10191B" stroke-width="2" opacity="1"/><text x="310" y="550" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">PROFESSIONAL EXPERIENCE</text><text x="310" y="615" font-family="Manrope" font-size="20" font-weight="600" fill="#10191B" text-anchor="start">Co-Founder &amp; Lead Software Engineer</text><text x="1130" y="615" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#D99B68" text-anchor="end">2021 — PRESENT</text><text x="310" y="650" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#53645E" text-anchor="start">Saptakarya · Bandung, Indonesia</text><text x="310" y="700" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#10191B"><tspan x="310" dy="0">Co-founded and led software engineering work across enterprise data workflows, operational</tspan><tspan x="310" dy="18.6">platforms, and business applications.</tspan></text><text x="330" y="775" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#10191B"><tspan x="330" dy="0">• Designed automated data-extraction and reporting workflows for hydropower operations.</tspan><tspan x="330" dy="17.6">• Developed monitoring and data-visualization systems for distribution and logistics workflows.</tspan><tspan x="330" dy="17.6">• Led municipal waste-management delivery and architected an F&amp;B POS platform core.</tspan><tspan x="330" dy="17.6">• Engineered HRM, CRM, accounting, ERP, and analytics middleware.</tspan></text><line x1="310" y1="875" x2="1130" y2