<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2180" viewBox="0 0 1440 2180" role="img" aria-labelledby="title desc"><title id="title">The System Atlas — component library proposal</title><desc id="desc">A component-system study showing palette roles, typography hierarchy, action tiers, card anatomy, metadata, status and focus states.</desc><rect x="0" y="0" width="1440" height="2180" rx="0" fill="#10191B" stroke="none" stroke-width="1"/><text x="100" y="105" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#D99B68" letter-spacing="1.2">SYSTEM ATLAS / COMPONENT LANGUAGE</text><text x="100" y="182" font-family="Manrope" font-size="56" font-weight="650" fill="#F1F0E8">A system built to make</text><text x="100" y="252" font-family="Manrope" font-size="56" font-weight="650" fill="#F1F0E8">complex work legible.</text><text x="100" y="315" font-family="Plus Jakarta Sans" font-size="16" font-weight="400" fill="#B4BFB8"><tspan x="100" dy="0">Reusable structure, quiet boundaries, and explicit states.</tspan><tspan x="100" dy="25.6">Proposal for review — not a production component library.</tspan></text><text x="100" y="425" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#86A89B" letter-spacing="1">01 / SEMANTIC COLOR ROLES</text><rect x="100" y="465" width="220" height="56" rx="2" fill="#10191B" stroke="#3C4A49" stroke-width="1"/><text x="100" y="547" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Atlas Ink</text><text x="320" y="547" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#10191B</text><rect x="350" y="465" width="220" height="56" rx="2" fill="#172426" stroke="#3C4A49" stroke-width="1"/><text x="350" y="547" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Deep Mineral</text><text x="570" y="547" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#172426</text><rect x="600" y="465" width="220" height="56" rx="2" fill="#1E2D30" stroke="#3C4A49" stroke-width="1"/><text x="600" y="547" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Raised Mineral</text><text x="820" y="547" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#1E2D30</text><rect x="850" y="465" width="220" height="56" rx="2" fill="#F1F0E8" stroke="#3C4A49" stroke-width="1"/><text x="850" y="547" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Limestone</text><text x="1070" y="547" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#F1F0E8</text><rect x="1100" y="465" width="220" height="56" rx="2" fill="#B4BFB8" stroke="#3C4A49" stroke-width="1"/><text x="1100" y="547" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Fog</text><text x="1320" y="547" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#B4BFB8</text><rect x="100" y="580" width="220" height="56" rx="2" fill="#81908A" stroke="#3C4A49" stroke-width="1"/><text x="100" y="662" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Sage Graphite</text><text x="320" y="662" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#81908A</text><rect x="350" y="580" width="220" height="56" rx="2" fill="#86A89B" stroke="#3C4A49" stroke-width="1"/><text x="350" y="662" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Sea Glass</text><text x="570" y="662" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#86A89B</text><rect x="600" y="580" width="220" height="56" rx="2" fill="#D99B68" stroke="#3C4A49" stroke-width="1"/><text x="600" y="662" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Signal Copper</text><text x="820" y="662" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#D99B68</text><rect x="850" y="580" width="220" height="56" rx="2" fill="#3C4A49" stroke="#3C4A49" stroke-width="1"/><text x="850" y="662" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Contour Line</text><text x="1070" y="662" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#3C4A49</text><rect x="1100" y="580" width="220" height="56" rx="2" fill="#53645E" stroke="#3C4A49" stroke-width="1"/><text x="1100" y="662" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Light Secondary</text><text x="1320" y="662" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8" text-anchor="end">#53645E</text><line x1="100" y1="720" x2="1340" y2="720" stroke="#3C4A49" stroke-width="1"/><text x="100" y="785" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#86A89B" letter-spacing="1">02 / TYPOGRAPHY HIERARCHY</text><text x="100" y="875" font-family="Manrope" font-size="38" font-weight="600" fill="#F1F0E8">Manrope — display and headings</text><text x="100" y="930" font-family="Plus Jakarta Sans" font-size="22" font-weight="500" fill="#F1F0E8">Plus Jakarta Sans — body and interface</text><text x="100" y="980" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#B4BFB8">Supporting copy stays readable at 1rem; mono is metadata only.</text><text x="100" y="1030" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#D99B68" letter-spacing="1.2">SECTION / 02</text><rect x="100" y="1090" width="1240" height="440" rx="2" fill="#172426" stroke="#3C4A49" stroke-width="1"/><text x="140" y="1155" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#86A89B" letter-spacing="1">03 / ACTION TIERS</text><text x="140" y="1205" font-family="Plus Jakarta Sans" font-size="14" font-weight="600" fill="#F1F0E8">Primary</text><rect x="140" y="1230" width="250" height="52" rx="2" fill="#D99B68" stroke="none" stroke-width="1"/><text x="160" y="1263" font-family="Plus Jakarta Sans" font-size="13" font-weight="700" fill="#10191B">Explore selected work ↗</text><text x="440" y="1205" font-family="Plus Jakarta Sans" font-size="14" font-weight="600" fill="#F1F0E8">Secondary</text><rect x="440" y="1230" width="220" height="52" rx="2" fill="none" stroke="#3C4A49" stroke-width="1"/><text x="460" y="1263" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">View résumé ↗</text><text x="710" y="1205" font-family="Plus Jakarta Sans" font-size="14" font-weight="600" fill="#F1F0E8">Tertiary</text><text x="710" y="1263" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Read case study ↗</text><line x1="140" y1="1330" x2="1300" y2="1330" stroke="#3C4A49" stroke-width="1"/><text x="140" y="1380" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Focus-visible</text><rect x="140" y="1400" width="220" height="58" rx="2" fill="none" stroke="#D99B68" stroke-width="1"/><rect x="146" y="1406" width="208" height="46" rx="1" fill="none" stroke="#3C4A49" stroke-width="1"/><text x="160" y="1437" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Keyboard focus</text><text x="440" y="1380" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Disabled action</text><rect x="440" y="1400" width="220" height="58" rx="2" fill="#1E2D30" stroke="#3C4A49" stroke-width="1"/><text x="460" y="1437" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#B4BFB8">Unavailable</text><text x="710" y="1380" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">Status is explicit</text><rect x="710" y="1400" width="240" height="58" rx="2" fill="#1E2D30" stroke="#3C4A49" stroke-width="1"/><circle cx="738" cy="1429" r="5" fill="#D99B68"/><text x="754" y="1435" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8">In progress</text><text x="1010" y="1418" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#B4BFB8"><tspan x="1010" dy="0">Marker reinforces</tspan><tspan x="1010" dy="16.5">the visible label.</tspan></text><text x="100" y="1610" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#86A89B" letter-spacing="1">04 / CONTENT COMPONENTS</text><rect x="100" y="1650" width="760" height="390" rx="2" fill="#F1F0E8" stroke="#C6C8BE" stroke-width="1"/><text x="140" y="1705" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#53645E" letter-spacing="0.7">INDEPENDENT PRODUCT / IN PROGRESS</text><text x="140" y="1775" font-family="Manrope" font-size="32" font-weight="600" fill="#10191B">Building a personal</text><text x="140" y="1825" font-family="Manrope" font-size="32" font-weight="600" fill="#10191B">professional platform</text><text x="140" y="1880" font-family="Plus Jakarta Sans" font-size="14" font-weight="400" fill="#53645E"><tspan x="140" dy="0">Reframing a personal website into a coherent</tspan><tspan x="140" dy="22.400000000000002">professional identity, portfolio, and résumé.</tspan></text><line x1="140" y1="1950" x2="820" y2="1950" stroke="#C6C8BE" stroke-width="1"/><text x="140" y="1995" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#53645E">Independent personal project</text><text x="820" y="1995" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#10191B" letter-spacing="0.5">READ CASE STUDY ↗</text><rect x="900" y="1650" width="440" height="390" rx="2" fill="#1E2D30" stroke="#3C4A49" stroke-width="1"/><text x="940" y="1705" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#86A89B" letter-spacing="0.8">METADATA / CONTEXT</text><text x="940" y="1760" font-family="Manrope" font-size="28" font-weight="600" fill="#F1F0E8">A line, not a pill.</text><text x="940" y="1810" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#B4BFB8"><tspan x="940" dy="0">Use compact metadata for dates,</tspan><tspan x="940" dy="21.45">role, publication, and reading time.</tspan><tspan x="940" dy="21.45">Never turn every label into a badge.</tspan></text><line x1="940" y1="1900" x2="1300" y2="1900" stroke="#3C4A49" stroke-width="1"/><text x="940" y="1940" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#B4BFB8">26 JUN 2026  /  5 MIN READ</text><text x="100" y="2110" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#81908A" letter-spacing="0.8">TOKEN PROPOSAL · OWNER REVIEW REQUIRED · NO PRODUCTION IMPLEMENTATION</text></svg>