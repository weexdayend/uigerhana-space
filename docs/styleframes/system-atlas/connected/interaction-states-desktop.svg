<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img" aria-labelledby="title desc"><title id="title">System Atlas desktop interaction-state specimens</title><desc id="desc">Static comparison of action hover, focus, pressed, unavailable, and card focus states on dark and light surfaces.</desc><rect x="0" y="0" width="1440" height="1660" fill="#10191B" stroke="none" stroke-width="1" rx="0"/><text x="100" y="100" font-family="ui-monospace, monospace" font-size="11" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">SYSTEM ATLAS / DESKTOP STATE SPECIMENS</text><text x="100" y="180" font-family="Manrope" font-size="58" font-weight="650" fill="#F1F0E8" text-anchor="start">Make every state</text><text x="100" y="275" font-family="Manrope" font-size="58" font-weight="650" fill="#F1F0E8" text-anchor="start">understandable.</text><text x="100" y="365" font-family="Plus Jakarta Sans" font-size="15" font-weight="400" fill="#B4BFB8"><tspan x="100" dy="0">Hover is enhancement. Focus is orientation. Disabled is a real</tspan><tspan x="100" dy="24">unavailable action—not a destination that does not exist.</tspan></text><rect x="80" y="380" width="1280" height="500" fill="#172426" stroke="#3C4A49" stroke-width="1" rx="2"/><text x="120" y="435" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">01 / DARK SURFACE</text><text x="120" y="485" font-family="Manrope" font-size="25" font-weight="600" fill="#F1F0E8" text-anchor="start">Primary action states</text><text x="120" y="545" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">DEFAULT</text><rect x="120" y="574" width="176" height="46" fill="#D99B68" stroke="none" stroke-width="0" rx="2"/><text x="132" y="603" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="120" y="655" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="start">Default contrast</text><text x="360" y="545" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">HOVER</text><rect x="360" y="574" width="176" height="46" fill="#D99B68" stroke="none" stroke-width="0" rx="2"/><text x="372" y="603" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="360" y="655" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="start">Underline / arrow cue</text><text x="600" y="545" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">FOCUS</text><rect x="592" y="563" width="192" height="64" fill="none" stroke="#D99B68" stroke-width="2" rx="4"/><rect x="600" y="574" width="176" height="46" fill="#D99B68" stroke="#D99B68" stroke-width="1" rx="2"/><text x="612" y="603" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="600" y="655" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="start">Copper focus ring</text><text x="840" y="545" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">PRESSED</text><rect x="840" y="574" width="176" height="46" fill="#C98B5D" stroke="none" stroke-width="0" rx="2"/><text x="852" y="603" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="840" y="655" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="start">Tonal change only</text><text x="1080" y="545" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">DISABLED</text><rect x="1080" y="574" width="176" height="46" fill="#1E2D30" stroke="#3C4A49" stroke-width="1" rx="2"/><text x="1092" y="603" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#81908A" text-anchor="start">Unavailable</text><text x="1080" y="655" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="start">No action / no hover</text><line x1="120" y1="710" x2="1320" y2="710" stroke="#3C4A49" stroke-width="1"/><text x="120" y="765" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">SECONDARY</text><rect x="120" y="785" width="190" height="48" fill="none" stroke="#86A89B" stroke-width="1" rx="2"/><text x="138" y="815" font-family="Plus Jakarta Sans" font-size="12" font-weight="600" fill="#F1F0E8" text-anchor="start">View résumé ↗</text><text x="360" y="765" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">TERTIARY</text><text x="360" y="815" font-family="Plus Jakarta Sans" font-size="12" font-weight="600" fill="#B4BFB8" text-anchor="start">Read case study ↗</text><line x1="360" y1="822" x2="503" y2="822" stroke="#B4BFB8" stroke-width="1"/><text x="640" y="795" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#B4BFB8"><tspan x="640" dy="0">Dark surface: Copper focus ring.</tspan><tspan x="640" dy="17.6">Sea Glass control boundary; Fog text.</tspan></text><text x="100" y="850" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#B4BFB8" text-anchor="start">Decorative contour lines never substitute for the visible edge of an interactive control.</text><rect x="80" y="930" width="1280" height="500" fill="#F1F0E8" stroke="#C6C8BE" stroke-width="1" rx="2"/><text x="120" y="985" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">02 / LIGHT SURFACE</text><text x="120" y="1035" font-family="Manrope" font-size="25" font-weight="600" fill="#10191B" text-anchor="start">Preserve the control edge</text><text x="120" y="1095" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">DEFAULT</text><rect x="120" y="1124" width="176" height="46" fill="#D99B68" stroke="#10191B" stroke-width="1" rx="2"/><text x="132" y="1153" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="120" y="1205" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#53645E" text-anchor="start">Ink edge</text><text x="360" y="1095" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">HOVER</text><rect x="360" y="1124" width="176" height="46" fill="#D99B68" stroke="#10191B" stroke-width="1" rx="2"/><text x="372" y="1153" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="360" y="1205" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#53645E" text-anchor="start">Underline / arrow cue</text><text x="600" y="1095" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">FOCUS</text><rect x="592" y="1113" width="192" height="64" fill="none" stroke="#10191B" stroke-width="2" rx="4"/><rect x="600" y="1124" width="176" height="46" fill="#D99B68" stroke="#10191B" stroke-width="1" rx="2"/><text x="612" y="1153" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="600" y="1205" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#53645E" text-anchor="start">Ink focus ring</text><text x="840" y="1095" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">PRESSED</text><rect x="840" y="1124" width="176" height="46" fill="#C98B5D" stroke="#10191B" stroke-width="1" rx="2"/><text x="852" y="1153" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#10191B" text-anchor="start">Explore work ↗</text><text x="840" y="1205" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#53645E" text-anchor="start">Tonal change</text><text x="1080" y="1095" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">DISABLED</text><rect x="1080" y="1124" width="176" height="46" fill="#E2E1D8" stroke="#53645E" stroke-width="1" rx="2"/><text x="1092" y="1153" font-family="Plus Jakarta Sans" font-size="11" font-weight="700" fill="#53645E" text-anchor="start">Unavailable</text><text x="1080" y="1205" font-family="Plus Jakarta Sans" font-size="10" font-weight="400" fill="#53645E" text-anchor="start">No action</text><line x1="120" y1="1260" x2="1320" y2="1260" stroke="#C6C8BE" stroke-width="1"/><text x="120" y="1315" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">SECONDARY</text><rect x="120" y="1335" width="190" height="48" fill="none" stroke="#10191B" stroke-width="1" rx="2"/><text x="138" y="1365" font-family="Plus Jakarta Sans" font-size="12" font-weight="600" fill="#10191B" text-anchor="start">View résumé ↗</text><text x="360" y="1315" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">TERTIARY</text><text x="360" y="1365" font-family="Plus Jakarta Sans" font-size="12" font-weight="600" fill="#10191B" text-anchor="start">Read case study ↗</text><line x1="360" y1="1372" x2="503" y2="1372" stroke="#10191B" stroke-width="1"/><text x="640" y="1345" font-family="Plus Jakarta Sans" font-size="11" font-weight="400" fill="#10191B"><tspan x="640" dy="0">Light surface: Atlas Ink boundary</tspan><tspan x="640" dy="17.6">and focus ring. Copper stays an accent.</tspan></text><rect x="80" y="1470" width="1280" height="130" fill="#172426" stroke="#3C4A49" stroke-width="1" rx="2"/><text x="120" y="1525" font-family="ui-monospace, monospace" font-size="10" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">03 / CONTENT CARD</text><rect x="390" y="1490" width="660" height="82" fill="#F1F0E8" stroke="#C6C8BE" stroke-width="1" rx="2"/><text x="414" y="1520" font-family="ui-monospace, monospace" font-size="9" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">INDEPENDENT PRODUCT  /  IN PROGRESS</text><text x="414" y="1550" font-family="Manrope" font-size="17" font-weight="600" fill="#10191B" text-anchor="start">Building a personal professional platform</text><rect x="1067" y="1484" width="264" height="96" fill="none" stroke="#D99B68" stroke-width="2" rx="3"/><text x="1090" y="1538" font-family="Plus Jakarta Sans" font-size="13" font-weight="600" fill="#F1F0E8" text-anchor="start">Focused link →</text></svg>