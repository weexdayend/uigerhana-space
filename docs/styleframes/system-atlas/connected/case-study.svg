<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3920" viewBox="0 0 1440 3920" role="img" aria-labelledby="t d"><title id="t">The System Atlas — case study detail styleframe</title><desc id="d">Detail page for the approved public project UI Gerhana. Status remains in progress. The architecture view is conceptual source architecture, not deployment topology or a product screenshot.</desc><rect x="0" y="0" width="1440" height="3920" rx="0" fill="#F1F0E8" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#10191B" stroke="none" stroke-width="1"/><text x="120" y="48" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#B4BFB8" text-anchor="start" letter-spacing="1">← ALL WORK</text><text x="1320" y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="400" fill="#D99B68" text-anchor="end">RÉSUMÉ ↗</text><text x="120" y="175" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">INDEPENDENT PRODUCT / IN PROGRESS</text><text x="120" y="245" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">STATUS · IN PROGRESS</text><text x="120" y="355" font-family="Manrope" font-size="62" font-weight="600" fill="#10191B" letter-spacing="-2.6"><tspan x="120" dy="0">Building a personal</tspan><tspan x="120" dy="63.24">professional platform</tspan></text><text x="120" y="520" font-family="Plus Jakarta Sans" font-size="17" font-weight="400" fill="#53645E"><tspan x="120" dy="0">Reframing a personal website into a coherent professional identity,</tspan><tspan x="120" dy="29.75">portfolio, and résumé experience.</tspan></text><rect x="120" y="650" width="1200" height="190" rx="2" fill="#E8E6DC" stroke="#C6C8BE" stroke-width="1"/><text x="160" y="700" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">CONTEXT</text><text x="160" y="742" font-family="Plus Jakarta Sans" font-size="16" font-weight="600" fill="#10191B" text-anchor="start">Independent personal project</text><text x="760" y="700" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">ROLE</text><text x="760" y="742" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B"><tspan x="760" dy="0">Product direction, identity and content decisions, information</tspan><tspan x="760" dy="20.150000000000002">architecture, visual direction, and implementation oversight.</tspan></text><text x="120" y="960" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">01 / CONTRIBUTION BREAKDOWN</text><text x="120" y="1020" font-family="Manrope" font-size="31" font-weight="600" fill="#10191B" text-anchor="start">The work behind the platform.</text><line x1="120" y1="1090" x2="1320" y2="1090" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="1125" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">PRODUCT DIRECTION</text><text x="470" y="1125" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B" text-anchor="start">Defined the Product Engineer positioning, primary audience, website goals, and story.</text><line x1="120" y1="1181" x2="1320" y2="1181" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="1216" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">INFORMATION ARCHITECTURE</text><text x="470" y="1216" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B" text-anchor="start">Reshaped the site around introduction, work, expertise, experience, philosophy, and résumé.</text><line x1="120" y1="1272" x2="1320" y2="1272" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="1307" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">VISUAL DIRECTION</text><text x="470" y="1307" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B" text-anchor="start">Retained and applied the existing visual direction and evolving identity system.</text><line x1="120" y1="1363" x2="1320" y2="1363" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="1398" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">CONTENT ARCHITECTURE</text><text x="470" y="1398" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B" text-anchor="start">Established typed, shared records for profile, experience, skills, work, and principles.</text><line x1="120" y1="1454" x2="1320" y2="1454" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="1489" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">IMPLEMENTATION OVERSIGHT</text><text x="470" y="1489" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B" text-anchor="start">Directed application structure, portfolio routes, online résumé, and quality workflow.</text><rect x="0" y="1570" width="1440" height="940" rx="0" fill="#172426" stroke="none" stroke-width="1"/><text x="120" y="1665" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">02 / CODE ARCHITECTURE VIEW</text><text x="120" y="1730" font-family="Manrope" font-size="37" font-weight="600" fill="#F1F0E8" text-anchor="start">How the site is put together.</text><text x="120" y="1780" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#B4BFB8"><tspan x="120" dy="0">A conceptual view of the current source organization. It is not a deployment</tspan><tspan x="120" dy="20.8">or infrastructure topology, and it does not depict a product screenshot.</tspan></text><rect x="120" y="1880" width="370" height="480" rx="2" fill="#1E2D30" stroke="#3C4A49" stroke-width="1"/><text x="146" y="1930" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">SHARED CONTENT</text><text x="146" y="1970" font-family="Plus Jakarta Sans" font-size="14" font-weight="600" fill="#F1F0E8" text-anchor="start">Typed records · src/data</text><line x1="146" y1="2010" x2="464" y2="2010" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="146" y="2050" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Profile &amp; site metadata</text><line x1="146" y1="2086" x2="464" y2="2086" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="146" y="2126" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Experience &amp; skills</text><line x1="146" y1="2162" x2="464" y2="2162" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="146" y="2202" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Work domains &amp; case studies</text><line x1="146" y1="2238" x2="464" y2="2238" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="146" y="2278" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Engineering principles</text><rect x="535" y="1880" width="370" height="480" rx="2" fill="#1E2D30" stroke="#3C4A49" stroke-width="1"/><text x="561" y="1930" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">APP ROUTES</text><text x="561" y="1970" font-family="Plus Jakarta Sans" font-size="14" font-weight="600" fill="#F1F0E8" text-anchor="start">Next.js App Router</text><line x1="561" y1="2010" x2="879" y2="2010" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="561" y="2050" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">/ — Homepage</text><line x1="561" y1="2086" x2="879" y2="2086" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="561" y="2126" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">/work — Work index</text><line x1="561" y1="2162" x2="879" y2="2162" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="561" y="2202" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">/work/[slug] — Case study</text><line x1="561" y1="2238" x2="879" y2="2238" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="561" y="2278" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">/cv — Online résumé</text><rect x="950" y="1880" width="370" height="480" rx="2" fill="#1E2D30" stroke="#3C4A49" stroke-width="1"/><text x="976" y="1930" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#86A89B" text-anchor="start" letter-spacing="1">PRESENTATION</text><text x="976" y="1970" font-family="Plus Jakarta Sans" font-size="14" font-weight="600" fill="#F1F0E8" text-anchor="start">Reusable components</text><line x1="976" y1="2010" x2="1294" y2="2010" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="976" y="2050" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Editorial page sections</text><line x1="976" y1="2086" x2="1294" y2="2086" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="976" y="2126" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Case-study templates</text><line x1="976" y1="2162" x2="1294" y2="2162" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="976" y="2202" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Résumé &amp; print layout</text><line x1="976" y1="2238" x2="1294" y2="2238" stroke="#3C4A49" stroke-width="1" opacity="1"/><text x="976" y="2278" font-family="Plus Jakarta Sans" font-size="12" font-weight="400" fill="#B4BFB8" text-anchor="start">Canvas, SVG, pixel visuals</text><path d="M 490 2120 L 520 2120 M 505 2108 L 520 2120 L 505 2132" fill="none" stroke="#86A89B" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M 905 2120 L 935 2120 M 920 2108 L 935 2120 L 920 2132" fill="none" stroke="#86A89B" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="2510" width="1440" height="1190" rx="0" fill="#F1F0E8" stroke="none" stroke-width="1"/><text x="120" y="2600" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">03 / PROJECT STORY</text><line x1="120" y1="2680" x2="1320" y2="2680" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="2728" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">THE CHALLENGE</text><text x="470" y="2725" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B"><tspan x="470" dy="0">The initial concept had a strong visual signature, but its content was framed</tspan><tspan x="470" dy="21.45">more like a software-services landing page than a personal professional platform.</tspan><tspan x="470" dy="21.45">The project needed one narrative that could introduce a Product Engineer, provide</tspan><tspan x="470" dy="21.45">credible evidence through work, and support professional opportunities.</tspan></text><line x1="120" y1="2920" x2="1320" y2="2920" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="2968" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">PRODUCT &amp; EXPERIENCE APPROACH</text><text x="470" y="2965" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B"><tspan x="470" dy="0">Reposition the experience around product thinking, interface design, software</tspan><tspan x="470" dy="21.45">engineering, and production-minded work.</tspan><tspan x="470" dy="21.45">Lead with a clear Product Engineer identity; make work, expertise, experience,</tspan><tspan x="470" dy="21.45">and engineering philosophy discoverable; treat factual accuracy as product quality.</tspan></text><line x1="120" y1="3160" x2="1320" y2="3160" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="3208" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">IMPLEMENTATION</text><text x="470" y="3205" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B"><tspan x="470" dy="0">Create typed content modules for profile, experience, skills, work domains, and</tspan><tspan x="470" dy="21.45">engineering principles. Build homepage, portfolio, and résumé from shared sources.</tspan><tspan x="470" dy="21.45">Next.js App Router · React · TypeScript · Tailwind CSS · Canvas · SVG</tspan></text><line x1="120" y1="3400" x2="1320" y2="3400" stroke="#C6C8BE" stroke-width="1" opacity="1"/><text x="120" y="3448" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="500" fill="#53645E" text-anchor="start" letter-spacing="1">CURRENT STATE</text><text x="470" y="3445" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#10191B"><tspan x="470" dy="0">The implementation includes the identity foundation, homepage sections, typed</tspan><tspan x="470" dy="21.45">professional content, an online résumé, and an evidence-led case-study route.</tspan><tspan x="470" dy="21.45">The project remains in progress. Visual samples are generated studies, not product</tspan><tspan x="470" dy="21.45">screenshots. Other project stories remain gated pending disclosure review.</tspan></text><rect x="0" y="3700" width="1440" height="220" rx="0" fill="#10191B" stroke="none" stroke-width="1"/><text x="120" y="3775" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="500" fill="#D99B68" text-anchor="start" letter-spacing="1">04 / TECHNOLOGY &amp; TOOLS</text><text x="120" y="3840" font-family="Plus Jakarta Sans" font-size="13" font-weight="400" fill="#F1F0E8" text-anchor="start">Next.js 16 App Router · React 19 · TypeScript · Tailwind CSS 4 · Canvas 2D · SVG · GitHub Actions</text></svg>