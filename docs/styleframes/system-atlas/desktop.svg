<g font-family="Manrope,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-3.2" fill="#F1F0E8"><text x="80" y="274">I build digital</text><text x="80" y="345">products from</text><text x="80" y="416">product logic to</text><text x="80" y="487">production.</text></g>
<g font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="17" fill="#B4BFB8"><text x="82" y="548">I work across product thinking, interface design, and</text><text x="82" y="575">software engineering—bringing complex workflows into</text><text x="82" y="602">software that is clear to use and practical to operate.</text></g>
