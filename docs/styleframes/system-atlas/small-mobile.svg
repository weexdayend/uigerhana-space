<g font-family="Manrope,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="-1.3" fill="#F1F0E8"><text x="16" y="185">I build digital</text><text x="16" y="219">products from</text><text x="16" y="253">product logic</text><text x="16" y="287">to production.</text></g>
<g font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12.2" fill="#B4BFB8"><text x="16" y="330">I work across product thinking, interface design,</text><text x="16" y="347">and software engineering—bringing complex</text><text x="16" y="364">workflows into software that is clear to use and</text><text x="16" y="381">practical to operate.</text></g>
