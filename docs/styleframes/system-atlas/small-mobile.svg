<title id="title">The System Atlas — small mobile 360 by 800</title><desc id="desc">Compact copy-first small-mobile refinement with a single sea-glass route and deliberate spacing.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10191B"/><stop offset="1" stop-color="#172426"/></linearGradient><clipPath id="atlas"><rect x="16" y="424" width="328" height="144" rx="2"/></clipPath></defs>
