<text x="24" y="198" font-family="Arial" font-size="32" font-weight="600" letter-spacing="-1.5" fill="#202523">I build digital</text><text x="24" y="236" font-family="Arial" font-size="32" font-weight="600" letter-spacing="-1.5" fill="#202523">products from</text><text x="24" y="274" font-family="Arial" font-size="32" font-weight="600" letter-spacing="-1.5" fill="#202523">product logic</text><text x="24" y="312" font-family="Arial" font-size="32" font-weight="600" letter-spacing="-1.5" fill="#202523">to production.</text>
<text x="24" y="352" font-family="Arial" font-size="13" fill="#727a73">I work across product thinking, interface design,</text><text x="24" y="370" font-family="Arial" font-size="13" fill="#727a73">and software engineering—bringing complex</text><text x="24" y="388" font-family="Arial" font-size="13" fill="#727a73">workflows into software that is clear to use and</text><text x="24" y="406" font-family="Arial" font-size="13" fill="#727a73">practical to operate.</text>
