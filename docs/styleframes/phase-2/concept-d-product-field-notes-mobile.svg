<text x="24" y="833" font-family="Arial" font-size="9" fill="#727a73">390 × 844 · RESPONSIVE SHORTLIST ONLY</text><text x="24" y="602" font-family="Arial" font-size="11" fill="#777" opacity="0"> </text><desc id="approved-copy">I build digital products from product logic to production. I work across product thinking, interface design, and software engineering—bringing complex workflows into software that is clear to use and practical to operate.</desc></svg>