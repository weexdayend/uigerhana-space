<text x="24" y="108" font-family="Arial" font-size="11" letter-spacing="1.3" fill="#e7a84f">IRVAN GERHANA</text><text x="24" y="132" font-family="Arial" font-size="11" fill="#a6b2ac">Product Engineer</text>
<text x="24" y="205" font-family="Arial" font-size="35" font-weight="600" letter-spacing="-1.6" fill="#edf0e9">I build digital</text><text x="24" y="246" font-family="Arial" font-size="35" font-weight="600" letter-spacing="-1.6" fill="#edf0e9">products from</text><text x="24" y="287" font-family="Arial" font-size="35" font-weight="600" letter-spacing="-1.6" fill="#edf0e9">product logic</text><text x="24" y="328" font-family="Arial" font-size="35" font-weight="600" letter-spacing="-1.6" fill="#edf0e9">to production.</text>
<text x="24" y="374" font-family="Arial" font-size="13" fill="#a6b2ac">I work across product thinking, interface design,</text><text x="24" y="394" font-family="Arial" font-size="13" fill="#a6b2ac">and software engineering—bringing complex</text><text x="24" y="414" font-family="Arial" font-size="13" fill="#a6b2ac">workflows into software that is clear to use and</text><text x="24" y="434" font-family="Arial" font-size="13" fill="#a6b2ac">practical to operate.</text>
