    <text x="0" y="388" font-size="58" font-weight="600" letter-spacing="-2.5">to production.</text>
    <text x="0" y="448" font-size="18" fill="#a6b2ac">I work across product thinking, interface design, and software engineering—</text><text x="0" y="476" font-size="18" fill="#a9a49a">bringing complex workflows into software that is clear to use and practical to operate.</text>
