<text x="20" y="91" font-family="Arial" font-size="11" letter-spacing="1.3" fill="#a15e36">IRVAN GERHANA</text><text x="20" y="113" font-family="Arial" font-size="11" fill="#727a73">Product Engineer</text>
<g font-family="Arial" fill="#202523" font-size="29" font-weight="600" letter-spacing="-1.3"><text x="20" y="166">I build digital</text><text x="20" y="202">products from</text><text x="20" y="238">product logic</text><text x="20" y="274">to production.</text></g>
<g font-family="Arial" font-size="12.5" fill="#727a73"><text x="20" y="315">I work across product thinking,</text><text x="20" y="333">interface design, and software</text><text x="20" y="351">engineering—bringing complex</text><text x="20" y="369">workflows into software that is clear</text><text x="20" y="387">to use and practical to operate.</text></g>
